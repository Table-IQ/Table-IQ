name: Feature request
description: Explain a recurring task TableIQ could improve.
title: "[Feature]: "
body:
  - type: textarea
    id: task
    attributes:
      label: What task are you trying to complete?
      description: "Describe the last time this happened, how often, and your current workaround."
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: "What would make this useful? Include the database engine/platform if relevant."
    validations:
      required: true
