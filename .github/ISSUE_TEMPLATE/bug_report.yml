name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, tokens, private rows or credential-bearing connection URLs. Report vulnerabilities privately through SECURITY.md."
  - type: input
    id: version
    attributes:
      label: TableIQ version and OS/architecture
      placeholder: "0.8.15 developer preview; macOS; Apple Silicon"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Database engine and version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: "Use synthetic schema/data and describe exact actions."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error or screenshots
      description: "Check attachments for secrets and personal data before uploading."
