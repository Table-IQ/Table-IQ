name: ci

# Everything that has to be true before a change lands. `release.yml` only runs on a tag,
# so until now nothing checked a pull request at all.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run
      - run: pnpm exec vite build

  rust:
    runs-on: ubuntu-22.04
    # The drivers are the product, so the suite runs against real servers. Same images,
    # ports and credentials as docker/*/docker-compose.yml, so a failure here reproduces
    # locally with `docker compose up` and nothing else.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tableiq
          POSTGRES_DB: tableiq
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d tableiq"
          --health-interval 3s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tableiq
          MYSQL_DATABASE: tableiq
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -ptableiq"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TIQ_PG_URL: postgres://postgres:tableiq@127.0.0.1:55432/tableiq
      TIQ_MYSQL_URL: mysql://root:tableiq@127.0.0.1:53306/tableiq
      # The wire-compatible engines of docker/profiles/docker-compose.yml (tests/profile_live.rs).
      TIQ_TIDB_URL: mysql://root@127.0.0.1:54000/test
      TIQ_CRDB_URL: postgres://root@127.0.0.1:56257/defaultdb?sslmode=disable
      TIQ_MARIADB_URL: mysql://root:tableiq@127.0.0.1:53307/tableiq
      # docker/mongo/docker-compose.yml: a single-node replica set (transactions) and a
      # standalone server (best-effort batches) — tests/mongo_browse.rs.
      TIQ_MONGO_URL: mongodb://127.0.0.1:57017/tableiq?directConnection=true
      TIQ_MONGO_STANDALONE_URL: mongodb://127.0.0.1:57018/tableiq
      # docker/redis/docker-compose.yml: Redis Stack (RedisJSON), and a plain Redis with an ACL
      # user — tests/redis_browse.rs. (The TLS server's URL is set on its own step, below.)
      TIQ_REDIS_URL: redis://127.0.0.1:56379/0
      TIQ_REDIS_ACL_URL: redis://agent:agentpw@127.0.0.1:56380/0
      TIQ_REDIS_ADMIN_URL: redis://:tableiq@127.0.0.1:56380/0
      # A plain empty Redis only tests/redis_mcp_live.rs uses: its INFO commandstats are the write oracle.
      TIQ_REDIS_ATTACK_URL: redis://127.0.0.1:56383/0
      # TIQ_MSSQL_URL is deliberately unset — mssql:2022 is a 1.5GB image for six tests, and
      # tests/sqlserver.rs skips itself when the variable is absent. Same for TIQ_PG_FULL_SEED
      # (see the seed step). Both suites run locally, where the containers are already up.
      #
      # The bundled DuckDB C++ library makes a debug `target/` big enough to fill the runner's
      # ~14 GB of free disk ("No space left on device" at link time). No incremental
      # artifacts and no debug info cut it by more than half; the test profile inherits
      # `dev`, so this covers `cargo test` too. Panic locations don't need debug info.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            postgresql-client mysql-client

      - name: Seed Postgres and MySQL
        env:
          PGPASSWORD: tableiq
        run: |
          # Both images run a throwaway init server that the healthcheck can answer, so wait
          # on a real client connection before seeding.
          for _ in $(seq 30); do psql -h 127.0.0.1 -p 55432 -U postgres -d tableiq -c 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          for _ in $(seq 30); do mysql -h 127.0.0.1 -P 53306 -uroot -ptableiq tableiq -e 'SELECT 1' >/dev/null 2>&1 && break; sleep 2; done
          # `wide` is seeded at 2,000 rows instead of the dev box's 1,000,000: the tests that
          # read it (introspect_browse, profile, explain, table_page_live) only need the table
          # and its first hundred rows in id order. The one test that genuinely needs the full
          # million — cursor_bounded_ram — gates itself on TIQ_PG_FULL_SEED and skips here,
          # rather than making every CI run wait on a million 1KB inserts.
          psql -h 127.0.0.1 -p 55432 -U postgres -d tableiq -v ON_ERROR_STOP=1 -v rows=2000 -f docker/postgres/seed.sql
          psql -h 127.0.0.1 -p 55432 -U postgres -d tableiq -v ON_ERROR_STOP=1 -f docker/postgres/qa.sql
          mysql -h 127.0.0.1 -P 53306 -uroot -ptableiq tableiq < docker/mysql/qa.sql

      # Preinstalled toolchains this job never uses (.NET, Android, Haskell, CodeQL) hold
      # ~25 GB; dropping them is what makes room for the DuckDB build (see the env note).
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      # Compose, not `services:` — CockroachDB needs a start command.
      - name: Start wire-compatible engines
        run: |
          docker compose -f docker/profiles/docker-compose.yml up -d --wait
          for i in $(seq 60); do
            mysql -h 127.0.0.1 -P 54000 -uroot -e 'select 1' >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "TiDB did not become ready" >&2; exit 1

      # Compose, not `services:` — the replica set has to be initiated and seeded, which the
      # healthcheck does; `--wait` returns once both servers are healthy.
      - name: Start MongoDB
        run: docker compose -f docker/mongo/docker-compose.yml up -d --wait

      # Compose, not `services:` — the healthcheck seeds each server once. The TLS server needs
      # its throwaway certificate first (not committed).
      - name: Start Redis
        run: |
          docker/redis/gen-certs.sh
          docker compose -f docker/redis/docker-compose.yml --profile tls up -d --wait

      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # No `pnpm build` first: these are all debug profiles, where tauri serves `devUrl`
      # instead of embedding `../dist`, so the frontend bundle is the web job's business.
      - name: Test
        working-directory: src-tauri
        run: cargo test --locked

      # The suite above skips a live test whose URL is unset. Every binary below talks only to
      # the databases this job starts (Postgres, MySQL, TiDB, CockroachDB, MariaDB, MongoDB, Redis), so a missing
      # URL here fails the job instead. Left out on purpose: sqlserver (no SQL Server in CI), the
      # SQL Server cases inside sql_log/search/mcp_live (they stay skips), backup_live/restore_live
      # (need TIQ_BACKUP_SHIM and the docker containers).
      - name: Live tests that must not skip
        working-directory: src-tauri
        run: |
          TIQ_REQUIRE_LIVE=1 cargo test --locked \
            --test apply_changes --test browse_non_utf8 --test cancel --test exec_live \
            --test explain --test fast_open --test foreign_keys --test guard_live \
            --test import --test introspect_browse --test mcp_live --test mysql_browse \
            --test mongo_browse --test mongo_mcp_live --test mysql_ssl_live --test null_pk_guard --test profile --test profile_live \
            --test query_edit --test redis_browse --test redis_mcp_live --test search --test sql_log --test structure \
            --test table_page_live --test table_stats --test transaction --test user_mgmt_live \
            --test window_bound

      # `rediss://` verified against a CA only SSL_CERT_FILE trusts: alone, because that variable
      # replaces every root certificate of the process.
      - name: Redis over TLS
        working-directory: src-tauri
        env:
          TIQ_REDIS_TLS_URL: rediss://127.0.0.1:56381/0
        run: SSL_CERT_FILE="$GITHUB_WORKSPACE/docker/redis/tls/ca.crt" TIQ_REQUIRE_LIVE=1 cargo test --locked --test redis_tls

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      # The QA bridge is behind a feature flag, so nothing else ever compiles it.
      - name: Build the QA bridge
        working-directory: src-tauri
        run: cargo build --features ipc-bridge --example ipc_bridge --locked

  # ClickHouse, Turso (libSQL), Elasticsearch, rqlite, Meilisearch, Qdrant and InfluxDB run in a job of their own: started next to the
  # ten servers of `rust` they take ~2 GB more of a 7 GB runner, which the DuckDB link also needs.
  http-engines:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      # docker/clickhouse/docker-compose.yml: the HTTP interface — tests/clickhouse_live.rs.
      TIQ_CLICKHOUSE_URL: http://default:tableiq@127.0.0.1:58123/tableiq
      # docker/libsql/docker-compose.yml: Turso's sqld over Hrana-HTTP (open, and one that wants a JWT) — tests/libsql_live.rs.
      TIQ_LIBSQL_URL: http://127.0.0.1:58080
      TIQ_LIBSQL_AUTH_URL: http://127.0.0.1:58081
      # docker/elasticsearch/docker-compose.yml: one single-node server, security off — tests/elasticsearch_live.rs.
      TIQ_ES_URL: http://127.0.0.1:59200
      # docker/rqlite/docker-compose.yml: rqlite over HTTP (open, and one with Basic auth) — tests/rqlite_live.rs.
      TIQ_RQLITE_URL: http://127.0.0.1:54001
      TIQ_RQLITE_AUTH_URL: http://127.0.0.1:54002
      # docker/meilisearch/docker-compose.yml: production mode, so the (throwaway) master key is really needed — tests/meilisearch_live.rs.
      TIQ_MEILI_URL: http://127.0.0.1:57700
      TIQ_MEILI_KEY: tableiq-fixture-master-key-0001
      # docker/qdrant/docker-compose.yml: an API key is set, so the (throwaway) key is really needed — tests/qdrant_live.rs.
      TIQ_QDRANT_URL: http://127.0.0.1:56333
      TIQ_QDRANT_KEY: tableiq-fixture-qdrant-key-0001
      # docker/influxdb/docker-compose.yml: one server without auth, one that needs the (throwaway, pinned) admin token — tests/influxdb_live.rs.
      TIQ_INFLUX_URL: http://127.0.0.1:58181
      TIQ_INFLUX_AUTH_URL: http://127.0.0.1:58182
      TIQ_INFLUX_TOKEN: apiv3_tableiq-fixture-token-for-tests-only-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEFGHIJKLMNOP
      # Same disk and debug-info settings as `rust` (the bundled DuckDB build fills the runner).
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      # Compose, not `services:` — the healthchecks seed each server once. The ClickHouse image
      # is ~1 GB, Elasticsearch ~1.2 GB (heap pinned to 512 MB) and the slowest to come up.
      - name: Start ClickHouse, Turso (libSQL), Elasticsearch, rqlite, Meilisearch, Qdrant and InfluxDB
        run: |
          docker compose -f docker/clickhouse/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/libsql/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/rqlite/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/meilisearch/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/qdrant/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/influxdb/docker-compose.yml up -d --wait --wait-timeout 300
          docker compose -f docker/elasticsearch/docker-compose.yml up -d --wait --wait-timeout 420

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: http-engines

      - name: Live tests that must not skip
        working-directory: src-tauri
        run: TIQ_REQUIRE_LIVE=1 cargo test --locked --test clickhouse_live --test libsql_live --test elasticsearch_live --test rqlite_live --test meilisearch_live --test qdrant_live --test influxdb_live
