name: Deploy Website

on:
  pull_request:
    paths:
      - 'website/**'
      - 'src/lib/profiles.json'
      - '.github/workflows/deploy-website.yml'
      - '.gitignore'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/lib/profiles.json'
      - '.github/workflows/deploy-website.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Website Assets & SEO
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build static site (Next.js export, then text exports)
        working-directory: website
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Check generated SEO, sitemap and local references
        working-directory: website
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/seo.py --check
          python3 scripts/validate.py

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: website-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID}"
      - name: Reject superseded deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "main has advanced; deploy the latest main workflow instead." >&2
            exit 1
          fi
      - name: Build static website
        working-directory: website
        run: |
          npm ci
          npm run build
          python3 scripts/validate.py
      - name: Deploy static website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy --config website/wrangler.jsonc
      - name: Notify participating search engines with IndexNow
        # A notification failure must not undo a healthy website deployment.
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error --max-time 20 \
            --retry 2 --retry-delay 3 \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary @website/out/indexnow.json \
            https://api.indexnow.org/indexnow
