name: CLA Assistant

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Serialize signature writes and rechecks to avoid overwriting another signer.
concurrency:
  group: cla-signatures-v1
  cancel-in-progress: false

jobs:
  cla:
    name: CLA signature
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      # Privileged workflow: never check out or execute pull request code here.
      - name: Check contributor signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Table-IQ/Table-IQ/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: 'dependabot[bot],renovate[bot]'
          lock-pullrequest-aftermerge: true
