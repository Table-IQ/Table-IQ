[package]
name = "tableiq"
version = "0.8.10"
description = "TableIQ — fast, local-first, AI-assisted database client"
authors = ["Rudresh Narwal"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tableiq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Dev-only QA harness: the real IPC commands served over HTTP (see README "Real-app QA").
# An example, not a [[bin]]: `tauri build` copies every [[bin]] into the app bundle, so a bin
# would ship this server (or fail to bundle when the feature is off, as in release CI).
[[example]]
name = "ipc_bridge"
required-features = ["ipc-bridge"]

[features]
ipc-bridge = ["tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures-util = "0.3"
arrow = { version = "53", features = ["ipc"] }
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2"] }
bytes = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json"] }
# Same SQLite library already used by sqlx; native online backup coordinates restore locks.
libsqlite3-sys = "=0.30.1"
thiserror = "2"
sysinfo = "0.32"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
redis = { version = "0.27", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager"] }
base64 = "0.22"
mongodb = "3"
russh = "0.45"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
extism = "1"
duckdb = { version = "1", features = ["bundled"] }
# The SQL log (`sql_log`) reads the statement sqlx already emits on its `sqlx::query` target.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# The in-app MCP server (`mcp`): Streamable HTTP on 127.0.0.1, mounted in an axum router.
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }

[dev-dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "sqlite", "json"] }
tempfile = "3"

# Release size + speed: strip symbols, thin LTO, one codegen unit. `panic = "unwind"` stays —
# the panic hook in `applog` needs unwinding to log and chain before the process goes down.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "unwind"

# ponytail: don't strip host-side proc-macro/build-script dylibs. rustc <1.98 + macOS 27
# ld leaves a 4-byte-aligned LINKEDIT string pool that dyld rejects ("mis-aligned LINKEDIT
# string pool"), breaking the sqlx_macros load. These artifacts never ship. Drop when on rustc >=1.98.
[profile.release.build-override]
strip = false
