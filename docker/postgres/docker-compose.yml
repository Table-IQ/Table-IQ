services:
  pg:
    image: postgres:16
    container_name: tableiq-pg
    environment:
      POSTGRES_PASSWORD: tableiq
      POSTGRES_DB: tableiq
    ports:
      - "55432:5432"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./qa.sql:/docker-entrypoint-initdb.d/20-qa.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tableiq"]
      interval: 3s
      timeout: 3s
      retries: 30
