# The token gate in front of Chroma (see docker-compose.yml). A request passes with the fixture token as
# `Authorization: Bearer …` or `X-Chroma-Token: …`, the two ways Chroma's own clients send one; any
# other gets a 401 and never reaches the server.
server {
    listen 80;
    default_type application/json;
    set $ok 0;
    if ($http_authorization = "Bearer tableiq-fixture-chroma-token-0001") { set $ok 1; }
    if ($http_x_chroma_token = "tableiq-fixture-chroma-token-0001") { set $ok 1; }
    location / {
        if ($ok = 0) { return 401 '{"error":"Unauthorized","message":"Unauthorized"}'; }
        proxy_pass http://chroma:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
