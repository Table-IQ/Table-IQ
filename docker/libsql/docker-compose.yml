# Turso's open-source server (sqld / libSQL) for tests/libsql_live.rs (and the Turso QA). Two servers:
#   libsql      no auth, on 58080 — seeded with seed.sql (a `_tiq_meta` marker, written last)
#               TIQ_LIBSQL_URL=http://127.0.0.1:58080
#   libsql-jwt  on 58081: every request needs a JWT signed by the throwaway Ed25519 key below
#               (the matching token is in tests/libsql_live.rs). TIQ_LIBSQL_AUTH_URL=http://127.0.0.1:58081
# The image has no curl or wget, so the healthcheck is seed.sh: bash over /dev/tcp posts one
# Hrana request. It seeds exactly once and passes only once the marker is there, so `up -d --wait`
# returns when the data is there and later edits to it are never undone. `down -v` resets.
# The image is pinned (v0.24.33) by its multi-architecture index digest (amd64 and arm64),
# like docker/mongo. Ports bind to 127.0.0.1 only.
services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33@sha256:f8ca0134cdded747793888e48591aece07647d9d598d3ac229aabfa93159ca88
    container_name: tableiq-libsql
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./seed.sh:/seed.sh:ro
      - ./seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD", "bash", "/seed.sh"]
      interval: 3s
      timeout: 20s
      retries: 40
      start_period: 3s
  libsql-jwt:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33@sha256:f8ca0134cdded747793888e48591aece07647d9d598d3ac229aabfa93159ca88
    container_name: tableiq-libsql-jwt
    environment:
      # The public half of a key generated for this file alone; its private half was discarded.
      SQLD_AUTH_JWT_KEY: y8S3wjUUWhH8Qd-7frvu47wn-_Ga7DAYeUbOzjD8Th8
    ports:
      - "127.0.0.1:58081:8080"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q 200
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 2s
