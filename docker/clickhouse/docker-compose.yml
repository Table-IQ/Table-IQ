# ClickHouse for tests/clickhouse_live.rs (and the ClickHouse QA): the HTTP interface on 58123.
# The image runs seed.sql only on first init, as the `default` user (password `tableiq`). Its
# throwaway init server answers /ping before the seed has run, so the healthcheck instead asks
# for the last row the seed inserts: `up -d --wait` returns only when the data is there.
# `down -v` resets.
#   TIQ_CLICKHOUSE_URL=http://default:tableiq@127.0.0.1:58123/tableiq
# `clickhouse-server:25.8` (LTS) is pinned by its multi-architecture index digest, like docker/mongo.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    container_name: tableiq-clickhouse
    ports:
      - "58123:8123"
    environment:
      CLICKHOUSE_DB: tableiq
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: tableiq
      # Lets seed.sql create the read-only account tests/clickhouse_live.rs logs in as.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(wget -qO- --header 'X-ClickHouse-User: default' --header 'X-ClickHouse-Key: tableiq'
          'http://localhost:8123/?query=SELECT+count()+FROM+tableiq.events')" = 200000
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
